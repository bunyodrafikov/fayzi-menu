<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fayzi Чайхана — Меню</title>
<meta name="description" content="Меню чайханы Fayzi: плов, шашлык, лагман, салаты, чай.">
<meta name="theme-color" content="#faf7f2">
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/prata-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted fonts (SIL OFL): no third-party request blocking first paint */
  @font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(fonts/manrope-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(fonts/manrope-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(fonts/manrope-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Prata; font-display: swap; src: url(fonts/prata-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Prata; font-display: swap; src: url(fonts/prata-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  :root {
    color-scheme: light;
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #1f1a17;
    --muted: #6b625a;
    --line: #ece6dd;
    --accent: #c2452d;        /* pomegranate */
    --accent-soft: #c2452d12;
    --gold: #c98a1b;          /* saffron */
    --shadow: 0 1px 2px rgb(60 40 20 / .06), 0 6px 20px rgb(60 40 20 / .07);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  .hero {
    text-align: center;
    padding: 40px 16px 20px;
  }
  .ornament { display: block; margin: 0 auto 12px; color: var(--gold); }
  .hero h1 {
    font: 400 40px/1 Prata, Georgia, serif;
    margin: 0;
    letter-spacing: .01em;
  }
  .hero p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  /* Category bar */
  /* No bar behind the chips: they float over the menu on their own pills */
  nav.cats { position: sticky; top: 0; z-index: 10; }
  nav.cats .row {
    display: flex; gap: 8px;
    max-width: 960px; margin: 0 auto;
    padding: 10px 16px 12px;
    overflow-x: auto; scrollbar-width: none;
    scroll-behavior: smooth;
    /* fade edges to hint the row scrolls */
    mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 28px), transparent);
  }
  nav.cats .row::-webkit-scrollbar { display: none; }
  nav.cats a {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 4px 16px 4px 4px;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--line), 0 2px 8px rgb(60 40 20 / .12);
    color: var(--text);
    text-decoration: none;
    font-size: 14px; font-weight: 600;
    white-space: nowrap;
    transition: background .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease), transform .15s var(--ease);
  }
  nav.cats a img, nav.cats a .dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--line);
    transition: box-shadow .25s var(--ease);
  }
  nav.cats a .dot { display: grid; place-items: center; color: var(--gold); background: #f4ede2; }
  @media (hover: hover) { nav.cats a:hover { box-shadow: inset 0 0 0 1px var(--accent), 0 2px 8px rgb(60 40 20 / .12); } }
  nav.cats a:active { transform: scale(.96); }
  nav.cats a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav.cats a.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgb(194 69 45 / .35);
  }
  nav.cats a.active img { box-shadow: 0 0 0 2px #fff; }

  /* Sections */
  main { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; }
  section { padding-top: 28px; }
  section h2 {
    display: flex; align-items: center; gap: 12px;
    font: 400 22px/1.2 Prata, Georgia, serif;
    margin: 0 0 10px;
  }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* Photo-first grid: guests choose by picture */
  .items { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 520px) { .items { grid-template-columns: repeat(2, 1fr); gap: 18px 14px; } }
  @media (min-width: 760px) { .items { grid-template-columns: repeat(3, 1fr); gap: 20px 16px; } }
  @media (min-width: 960px) { .items { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 960px) { main { max-width: 1160px; } nav.cats .row { max-width: 1160px; } }

  .item {
    all: unset;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  @media (hover: hover) {
    .item:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgb(60 40 20 / .06), 0 12px 28px rgb(60 40 20 / .12); }
    .item:hover .photo img { transform: scale(1.04); }
    .item:hover .more { background: var(--accent); color: #fff; }
  }
  .item:active { transform: scale(.985); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .photo {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--line);
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform .5s var(--ease), opacity .4s var(--ease);
  }
  .photo.empty {
    display: grid; place-items: center;
    color: var(--gold);
    background: #f4ede2;
  }
  .card-body { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 14px; flex: 1; }
  .name { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .teaser {
    color: var(--muted); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; }
  .price { font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .more {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 10px 6px 12px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px; font-weight: 700;
    transition: background .2s, color .2s;
  }

  /* Detail sheet */
  dialog {
    padding: 0; border: 0;
    width: min(560px, 100%);
    max-width: 100%; max-height: 92dvh;
    border-radius: 24px;
    background: var(--surface); color: var(--text);
    overflow: auto;
    overscroll-behavior: contain;
  }
  dialog::backdrop { background: rgb(30 20 10 / .45); backdrop-filter: blur(3px); }
  dialog[open] { animation: pop .35s var(--ease); }
  dialog[open]::backdrop { animation: fade .3s var(--ease); }
  @media (max-width: 639px) {
    /* bottom sheet on phones */
    dialog { margin: auto 0 0; border-radius: 24px 24px 0 0; }
    dialog[open] { animation: rise .4s var(--ease); }
  }
  /* exit: same motion reversed, a bit faster */
  dialog.closing { animation: pop-out .22s var(--ease) forwards; }
  dialog.closing::backdrop { animation: fade-out .22s var(--ease) forwards; }
  @media (max-width: 639px) { dialog.closing { animation: sink .28s cubic-bezier(.4, 0, 1, 1) forwards; } }
  @keyframes pop-out { to { opacity: 0; transform: scale(.96); } }
  @keyframes sink { to { transform: translateY(100%); } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  @keyframes rise { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  .sheet-photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--line); }
  .sheet-body { padding: 18px 20px calc(24px + env(safe-area-inset-bottom)); }
  .sheet-body h3 { font: 400 24px/1.2 Prata, Georgia, serif; margin: 0; }
  .sheet-body .price { display: block; margin: 6px 0 14px; font-size: 20px; color: var(--accent); }
  .label {
    font-size: 11px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 2px;
  }
  .ingredients { margin: 0; color: var(--muted); }
  .close {
    all: unset;
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgb(0 0 0 / .45); color: #fff;
    backdrop-filter: blur(6px);
    cursor: pointer;
  }
  .close:focus-visible { outline: 2px solid #fff; }

  /* Reveal on scroll */
  .js .reveal { opacity: 0; transform: translateY(10px); }
  .js .reveal.in { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .5s var(--ease); }

  /* Images fade in once loaded */
  img.lazy { opacity: 0; transition: opacity .4s var(--ease); }
  img.lazy.loaded { opacity: 1; }

  .error { color: var(--muted); padding: 40px 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    .js .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <svg class="ornament" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
    <path d="M22 2l5.9 14.1L42 22l-14.1 5.9L22 42l-5.9-14.1L2 22l14.1-5.9z"/>
    <path d="M22 9l3.7 9.3L35 22l-9.3 3.7L22 35l-3.7-9.3L9 22l9.3-3.7z"/>
    <circle cx="22" cy="22" r="3"/>
  </svg>
  <h1>Fayzi</h1>
  <p>Чайхана · Меню</p>
</header>
<nav class="cats" aria-label="Категории"><div class="row" id="cats"></div></nav>
<main id="menu"></main>
<dialog id="sheet" aria-label="Блюдо"></dialog>

<script src="menu.js"></script>
<script>
document.documentElement.classList.add('js');
const fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const STAR = '<svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M22 2l5.9 14.1L42 22l-14.1 5.9L22 42l-5.9-14.1L2 22l14.1-5.9z"/></svg>';

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  n.append(...children);
  return n;
}

// build.py makes <photo>-720.webp and <photo>-1200.webp; the browser picks the one matching screen size and density.
const CARD_SIZES = '(max-width: 519px) calc(100vw - 32px), (max-width: 759px) 50vw, (max-width: 959px) 33vw, 280px';
const SHEET_SIZES = '(max-width: 639px) 100vw, 560px';
const photoAttrs = (base, sizes) => ({ src: base + '-720.webp', srcset: `${base}-720.webp 720w, ${base}-1200.webp 1200w`, sizes });

function img(base, cls, eager) {
  // First photos on screen load at once with high priority; the rest wait until scrolled near.
  const a = { ...photoAttrs(base, CARD_SIZES), alt: '', class: cls + ' lazy' };
  const i = el('img', eager ? { ...a, fetchpriority: 'high' } : { ...a, loading: 'lazy', decoding: 'async' });
  const done = () => i.classList.add('loaded');
  i.complete ? done() : (i.onload = i.onerror = done);
  return i;
}

const sheet = document.getElementById('sheet');
// Animated close for every path: ✕ button, backdrop tap, Esc / Android back (the 'cancel' event).
function closeSheet() {
  if (!sheet.open || sheet.classList.contains('closing')) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return sheet.close();
  sheet.classList.add('closing');
  let done = false;
  const finish = () => { if (done) return; done = true; sheet.classList.remove('closing'); sheet.close(); };
  sheet.addEventListener('animationend', finish, { once: true });
  setTimeout(finish, 400); // in case animationend never fires
}
sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); }); // backdrop tap
sheet.addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });

async function openSheet(it, cardImg) {
  const body = el('div', { class: 'sheet-body' },
    el('h3', {}, it.name),
    el('p', { class: 'price' }, fmt.format(it.price) + ' ₽'));
  if (it.ingredients) body.append(el('p', { class: 'label' }, 'Состав'), el('p', { class: 'ingredients' }, it.ingredients));
  const close = el('button', { type: 'button', class: 'close', 'aria-label': 'Закрыть' });
  close.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg>';
  close.onclick = closeSheet;
  sheet.replaceChildren(close);
  if (it.photo) {
    // Reuse exactly the file the card already loaded (no second download). Decode before showing so it never
    // flashes empty; cap the wait in case the card photo hadn't finished downloading yet.
    const photo = el('img', cardImg?.currentSrc
      ? { src: cardImg.currentSrc, class: 'sheet-photo', alt: it.name }
      : { ...photoAttrs(it.photo, SHEET_SIZES), class: 'sheet-photo', alt: it.name });
    await Promise.race([photo.decode().catch(() => {}), new Promise(r => setTimeout(r, 150))]);
    sheet.append(photo);
  }
  sheet.append(body);
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
}

let eagerLeft = 2; // about one phone screen
function renderItem(it) {
  const btn = el('button', { type: 'button', class: 'item reveal', 'aria-haspopup': 'dialog' });
  const photo = el('span', { class: 'photo' + (it.photo ? '' : ' empty') });
  if (it.photo) photo.append(img(it.photo, '', eagerLeft-- > 0));
  else photo.innerHTML = STAR;
  const body = el('span', { class: 'card-body' }, el('span', { class: 'name' }, it.name));
  if (it.ingredients) body.append(el('span', { class: 'teaser' }, it.ingredients));
  const more = el('span', { class: 'more', 'aria-hidden': 'true' }, 'Подробнее');
  more.insertAdjacentHTML('beforeend', '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg>');
  body.append(el('span', { class: 'card-foot' }, el('span', { class: 'price' }, fmt.format(it.price) + ' ₽'), more));
  btn.append(photo, body);
  btn.addEventListener('click', () => openSheet(it, photo.querySelector('img')));
  return btn;
}

function render(menu) {
  const nav = document.getElementById('cats');
  const main = document.getElementById('menu');

  menu.forEach((cat, ci) => {
    const id = 'c' + ci;
    const chip = el('a', { href: '#' + id });
    if (cat.thumb) chip.append(el('img', { src: cat.thumb, alt: '', width: 34, height: 34, decoding: 'async' }));
    else chip.insertAdjacentHTML('beforeend', `<span class="dot">${STAR.replace(/40/g, '18')}</span>`);
    chip.append(cat.name);
    nav.append(chip);
    const list = el('div', { class: 'items' });
    cat.items.forEach(it => list.append(renderItem(it)));
    main.append(el('section', { id, 'aria-label': cat.name }, el('h2', {}, cat.name), list));
  });

  // Reveal rows as they enter the viewport.
  const reveal = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); }
  }, { rootMargin: '0px 0px -5% 0px' });
  main.querySelectorAll('.reveal').forEach(n => reveal.observe(n));

  // Highlight the chip for the section in view.
  const links = new Map([...nav.querySelectorAll('a')].map(a => [a.hash.slice(1), a]));
  let active = null, jumping = false;
  const row = nav;
  function activate(a) {
    if (a === active) return;
    active?.classList.remove('active');
    (active = a).classList.add('active');
    // Scroll the chip row only as far as needed to show the chip (offsetLeft is wrong here: it includes the row's centring margin).
    const r = row.getBoundingClientRect(), c = a.getBoundingClientRect(), pad = 32;
    const dx = c.left < r.left + pad ? c.left - r.left - pad : c.right > r.right - pad ? c.right - r.right + pad : 0;
    if (dx) row.scrollBy({ left: dx, behavior: 'smooth' });
  }
  const spy = new IntersectionObserver(entries => {
    if (jumping) return; // ignore sections passed during a chip-click scroll
    for (const e of entries) if (e.isIntersecting) activate(links.get(e.target.id));
  }, { rootMargin: '-70px 0px -70% 0px' });

  // Chip click: highlight at once, glide to the section.
  const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  nav.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    activate(a);
    jumping = true;
    const done = () => { jumping = false; };
    addEventListener('scrollend', done, { once: true });
    setTimeout(done, 1200); // scrollend never fires if already in place, or in older Safari
    document.getElementById(a.hash.slice(1)).scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
  });
  main.querySelectorAll('section').forEach(s => spy.observe(s));

}

// Always open at the top (header first): drop any old #section from the URL and don't restore scroll on reload.
history.scrollRestoration = 'manual';
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
if (window.MENU) render(window.MENU);
else document.getElementById('menu').append(el('p', { class: 'error' }, 'Не удалось загрузить меню. Обновите страницу.'));
scrollTo(0, 0);
</script>
</body>
</html>
