<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fayzi — редактор меню</title>
<meta name="theme-color" content="#110b07">
<style>
  @font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(../fonts/manrope-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(../fonts/manrope-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Prata; font-display: swap; src: url(../fonts/prata-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {
    color-scheme: dark;
    --bg: #110b07; --surface: #1c140e; --surface-2: #261b13; --text: #f4eee6; --muted: #b3a597; --line: #2f241b;
    --accent: #e3a43b; --on-accent: #1a1206; --danger: #f07a64;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font: 400 28px/1.1 Prata, Georgia, serif; margin: 8px 0 20px; }
  h1 small { font: 500 14px Manrope, sans-serif; color: var(--muted); margin-left: 8px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
  button.danger { color: var(--danger); }
  button.icon { min-width: 40px; padding: 8px; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  textarea { min-height: 84px; resize: vertical; }
  label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  [hidden] { display: none !important; }

  #login { max-width: 360px; margin: 12vh auto 0; }
  #login button { width: 100%; margin-top: 16px; }
  .error { color: var(--danger); }

  section.cat { margin: 0 0 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .cat-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line); }
  .cat-head h2 { flex: 1; margin: 0; font: 400 20px/1.2 Prata, Georgia, serif; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .dish { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px; text-align: left; }
  .thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex: none; }
  .dish span { min-width: 0; }
  .dish b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dish small { color: var(--muted); }
  .add-dish { margin: 10px; }
  .moves { display: flex; gap: 4px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar div { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .bar p { flex: 1; margin: 0; color: var(--muted); font-size: 14px; }
  .bar .primary { min-width: 140px; }

  dialog { width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); padding: 18px 18px 14px; }
  dialog::backdrop { background: rgb(0 0 0 / .6); }
  dialog h3 { margin: 0 0 4px; font: 400 22px Prata, Georgia, serif; }
  .nutr { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .nutr label { margin-top: 0; }
  .photo-edit { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .photo-edit img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
  .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
</style>
</head>
<body>
<main>
  <form id="login" hidden>
    <h1>Fayzi <small>редактор меню</small></h1>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" role="alert"></p>
    <button class="primary">Войти</button>
  </form>

  <div id="editor" hidden>
    <h1>Fayzi <small>редактор меню</small></h1>
    <div id="cats"></div>
    <button type="button" id="add-cat">+ Категория</button>
  </div>
</main>

<div class="bar" id="bar" hidden><div>
  <p id="status" role="status" aria-live="polite"></p>
  <button type="button" class="primary" id="save" disabled>Сохранить</button>
</div></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="dish-form" method="dialog" novalidate>
    <h3 id="dlg-title">Блюдо</h3>
    <label for="f-name">Название</label>
    <input id="f-name" required maxlength="120">
    <label for="f-price">Цена, ₽</label>
    <input id="f-price" inputmode="decimal" required>
    <label for="f-cat">Категория</label>
    <select id="f-cat"></select>
    <label for="f-ingr">Состав</label>
    <textarea id="f-ingr" maxlength="2000"></textarea>
    <label id="nutr-label">КБЖУ на 100 г <span class="hint">(можно оставить пустым)</span></label>
    <div class="nutr" role="group" aria-labelledby="nutr-label">
      <div><label for="f-k">Ккал</label><input id="f-k" inputmode="decimal"></div>
      <div><label for="f-p">Белки, г</label><input id="f-p" inputmode="decimal"></div>
      <div><label for="f-f">Жиры, г</label><input id="f-f" inputmode="decimal"></div>
      <div><label for="f-c">Углев., г</label><input id="f-c" inputmode="decimal"></div>
    </div>
    <label>Фото</label>
    <div class="photo-edit">
      <img id="f-img" alt="" hidden onerror="this.removeAttribute('src')">
      <button type="button" id="f-pick">Выбрать фото</button>
      <button type="button" id="f-unphoto" class="danger">Убрать фото</button>
      <input id="f-file" type="file" accept="image/*" hidden>
    </div>
    <p class="error" id="dlg-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="f-delete" class="danger">Удалить блюдо</button>
      <span class="spacer"></span>
      <button type="button" id="f-cancel">Отмена</button>
      <button class="primary">Готово</button>
    </div>
  </form>
</dialog>

<script>
// Admin page: loads menu.json through the Worker (worker/), edits it here, saves it back as one commit.
// The Worker checks the password; this page holds nothing secret.
const API = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://fayzi-menu-admin.fayzi-menu.workers.dev';

const $ = id => document.getElementById(id);
let password = sessionStorage.getItem('pw') || '';
let menu = [], sha = '', dirty = false, saving = false;
let newPhotos = {};   // "new:<n>" -> base64 JPEG, sent on save
const previews = {};  // photo ref -> object URL, for photos the site hasn't built yet
let photoSeq = 0;

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k.startsWith('on') ? (n[k] = v) : n.setAttribute(k, v);
  n.append(...children);
  return n;
}
const fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const thumbSrc = photo => previews[photo] || `../images/${photo.replace(/\.[^.]+$/, '')}-160.webp`;
// A just-saved photo has no web sizes until the site rebuilds (1–2 min): show an empty box, not a broken image.
const hideBroken = e => e.target.removeAttribute('src');
const setStatus = (text, error) => { $('status').textContent = text; $('status').classList.toggle('error', !!error); };

async function api(method, body) {
  const res = await fetch(API + '/menu', {
    method,
    headers: { Authorization: 'Bearer ' + password, ...(body && { 'Content-Type': 'application/json' }) },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || 'Ошибка ' + res.status), { status: res.status });
  return data;
}

// ---------- login ----------
async function load() {
  try {
    ({ menu, sha } = await api('GET'));
    sessionStorage.setItem('pw', password);
    $('login').hidden = true;
    $('editor').hidden = $('bar').hidden = false;
    newPhotos = {};
    markDirty(false);
    render();
  } catch (e) {
    sessionStorage.removeItem('pw');
    $('login').hidden = false;
    $('login-error').textContent = e.status === 401 ? 'Неверный пароль' : 'Не удалось подключиться: ' + e.message;
    $('pw').focus();
  }
}
$('login').onsubmit = e => { e.preventDefault(); password = $('pw').value; $('login-error').textContent = ''; load(); };

// ---------- list ----------
function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; markDirty(); render(); }
function moveButtons(arr, i, what) {
  return el('span', { class: 'moves' },
    el('button', { type: 'button', class: 'icon', 'aria-label': `${what}: выше`, onclick: () => move(arr, i, -1), ...(i === 0 && { disabled: '' }) }, '↑'),
    el('button', { type: 'button', class: 'icon', 'aria-label': `${what}: ниже`, onclick: () => move(arr, i, 1), ...(i === arr.length - 1 && { disabled: '' }) }, '↓'));
}

function render() {
  $('cats').replaceChildren(...menu.map((cat, ci) => {
    const head = el('div', { class: 'cat-head' }, el('h2', {}, cat.name),
      el('button', { type: 'button', onclick: () => renameCat(ci) }, 'Переименовать'),
      moveButtons(menu, ci, cat.name));
    if (!cat.items.length) head.append(el('button', { type: 'button', class: 'danger', onclick: () => { menu.splice(ci, 1); markDirty(); render(); } }, 'Удалить'));
    const list = el('ul', {}, ...cat.items.map((it, ii) => {
      const thumb = it.photo ? el('img', { class: 'thumb', src: thumbSrc(it.photo), alt: '', loading: 'lazy', onerror: hideBroken }) : el('span', { class: 'thumb' });
      return el('li', {},
        el('button', { type: 'button', class: 'dish', onclick: () => editDish(ci, ii) },
          thumb, el('span', {}, el('b', {}, it.name), el('small', {}, fmt.format(it.price) + ' ₽'))),
        moveButtons(cat.items, ii, it.name));
    }));
    return el('section', { class: 'cat' }, head, list,
      el('button', { type: 'button', class: 'add-dish', onclick: () => editDish(ci, -1) }, '+ Блюдо'));
  }));
}

function renameCat(ci) {
  const name = prompt('Название категории', menu[ci].name)?.trim();
  if (name && name !== menu[ci].name) { menu[ci].name = name; markDirty(); render(); }
}
$('add-cat').onclick = () => {
  const name = prompt('Название новой категории')?.trim();
  if (name) { menu.push({ name, items: [] }); markDirty(); render(); }
};

// ---------- dish dialog ----------
const dlg = $('dlg');
let editing = null; // { ci, ii, photo }
const NUTR = ['f-k', 'f-p', 'f-f', 'f-c'];
const num = v => { const s = String(v).replace(/\s/g, '').replace(',', '.'); return s === '' || isNaN(s) ? NaN : Number(s); };

function showPhoto(photo) {
  editing.photo = photo;
  $('f-img').hidden = !photo;
  if (photo) $('f-img').src = thumbSrc(photo);
  $('f-unphoto').hidden = !photo;
  $('f-pick').textContent = photo ? 'Заменить фото' : 'Выбрать фото';
}

function editDish(ci, ii) {
  const it = ii >= 0 ? menu[ci].items[ii] : { name: '', price: '', ingredients: '', photo: '' };
  editing = { ci, ii };
  $('dlg-title').textContent = ii >= 0 ? 'Блюдо' : 'Новое блюдо';
  $('f-name').value = it.name;
  $('f-price').value = it.price;
  $('f-ingr').value = it.ingredients;
  $('f-cat').replaceChildren(...menu.map((c, i) => el('option', { value: i, ...(i === ci && { selected: '' }) }, c.name)));
  NUTR.forEach((id, i) => { $(id).value = it.nutrition ? it.nutrition[i] : ''; });
  $('f-delete').hidden = ii < 0;
  $('dlg-error').textContent = '';
  showPhoto(it.photo);
  dlg.showModal();
}

$('f-pick').onclick = () => $('f-file').click();
$('f-unphoto').onclick = () => showPhoto('');
$('f-file').onchange = async () => {
  const file = $('f-file').files[0];
  $('f-file').value = '';
  if (!file) return;
  $('dlg-error').textContent = '';
  $('f-pick').disabled = true;
  try {
    const blob = await toJpeg(file);
    const key = `new:${++photoSeq}`;
    newPhotos[key] = await toBase64(blob);
    previews[key] = URL.createObjectURL(blob);
    showPhoto(key);
  } catch {
    $('dlg-error').textContent = 'Не удалось открыть это фото. Попробуйте другое (JPEG/PNG).';
  } finally {
    $('f-pick').disabled = false;
  }
};

// Shrink to at most 2000 px (the site never shows more than 1200) and re-encode as JPEG, which every browser can make.
async function toJpeg(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = el('canvas', { width: Math.round(bmp.width * s), height: Math.round(bmp.height * s) });
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok, fail) => c.toBlob(b => (b ? ok(b) : fail()), 'image/jpeg', 0.88));
}
const toBase64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(blob); });

$('dish-form').onsubmit = e => {
  e.preventDefault();
  const name = $('f-name').value.trim(), price = num($('f-price').value);
  const nutr = NUTR.map(id => $(id).value.trim());
  const err = !name ? 'Введите название'
    : !(price >= 0) ? 'Цена должна быть числом'
    : nutr.some(Boolean) && !nutr.every(v => num(v) >= 0) ? 'КБЖУ: заполните все четыре числа или оставьте все пустыми'
    : '';
  if (err) { $('dlg-error').textContent = err; return; }
  const it = { name, price, ingredients: $('f-ingr').value.trim(), photo: editing.photo || '' };
  if (nutr.some(Boolean)) it.nutrition = nutr.map(v => Math.round(num(v)));
  const { ci, ii } = editing, to = Number($('f-cat').value);
  if (ii >= 0 && to === ci) menu[ci].items[ii] = it;
  else {
    if (ii >= 0) menu[ci].items.splice(ii, 1);
    menu[to].items.push(it);
  }
  dlg.close();
  markDirty();
  render();
};
$('f-cancel').onclick = () => dlg.close();
$('f-delete').onclick = () => {
  if (!confirm(`Удалить «${menu[editing.ci].items[editing.ii].name}»?`)) return;
  menu[editing.ci].items.splice(editing.ii, 1);
  dlg.close();
  markDirty();
  render();
};

// ---------- save ----------
function markDirty(on = true) {
  dirty = on;
  $('save').disabled = !dirty || saving;
  if (on) setStatus('Есть несохранённые изменения');
}
addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });

$('save').onclick = async () => {
  saving = true;
  $('save').disabled = true;
  setStatus('Сохраняю…');
  // Send only the new photos still in use.
  const used = new Set(menu.flatMap(c => c.items.map(i => i.photo)));
  const photos = Object.fromEntries(Object.entries(newPhotos).filter(([k]) => used.has(k)));
  try {
    const sent = menu;
    const res = await api('POST', { sha, menu: sent, photos });
    // Keep local previews for new photos under their saved names until the site has built them.
    res.menu.forEach((c, ci) => c.items.forEach((it, ii) => {
      const ref = sent[ci].items[ii].photo;
      if (previews[ref]) previews[it.photo] = previews[ref];
    }));
    ({ menu, sha } = res);
    newPhotos = {};
    saving = false;
    markDirty(false);
    render();
    setStatus('Сохранено. Сайт обновится через 1–2 минуты.');
  } catch (e) {
    saving = false;
    markDirty();
    setStatus(e.status === 401 ? 'Пароль больше не подходит. Обновите страницу.' : e.message, true);
  }
};

if (password) load(); else $('login').hidden = false;
</script>
</body>
</html>
